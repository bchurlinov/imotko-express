# Builds the production image off the VPS (Dokploy warns local builds can freeze the host) and pushes it to GHCR,
# tagged with the commit SHA (immutable; the deploy step pins the Dokploy API app to it) and `main` (latest build,
# for manual pulls and the worker).
#
# Only the API app is redeployed automatically. The Facebook worker is deployed by hand with the
# pause -> drain -> deploy -> resume routine (docs: express-vps-migration-runbook.md, Phase 8 step 3).
#
# Repository settings needed before the deploy step runs:
#   Variables: DOKPLOY_DEPLOY_ENABLED=true, DOKPLOY_URL=https://dock.imotko.mk
#   Secrets:   DOKPLOY_API_KEY, DOKPLOY_API_APPLICATION_ID
name: Build and deploy image

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-image-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  # Not named `Dockerfile`: Railway auto-switches to any root Dockerfile, and Railway must keep its
                  # current build while it is the fallback.
                  file: Dockerfile.vps
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ github.sha }}
                      ghcr.io/${{ github.repository }}:main
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy API on Dokploy
              if: ${{ github.ref == 'refs/heads/main' && vars.DOKPLOY_DEPLOY_ENABLED == 'true' }}
              env:
                  DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
                  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
                  APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
                  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
              # Pin the app to this commit's immutable tag first, so the deploy can't reuse a cached `:main` and the
              # Dokploy UI always shows which commit is live. Rollback = set the image to an older `:<sha>` and deploy.
              run: |
                  curl --fail-with-body -sS -X POST "${DOKPLOY_URL}/api/application.update" \
                    -H "Content-Type: application/json" \
                    -H "x-api-key: ${DOKPLOY_API_KEY}" \
                    -d "$(jq -n --arg id "$APPLICATION_ID" --arg image "$IMAGE" '{applicationId: $id, dockerImage: $image}')"

                  curl --fail-with-body -sS -X POST "${DOKPLOY_URL}/api/application.deploy" \
                    -H "Content-Type: application/json" \
                    -H "x-api-key: ${DOKPLOY_API_KEY}" \
                    -d "$(jq -n --arg id "$APPLICATION_ID" --arg title "${GITHUB_SHA::7}" '{applicationId: $id, title: $title}')"
