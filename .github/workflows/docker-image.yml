# Builds the production image off the VPS (Dokploy warns local builds can freeze the host) and pushes it to GHCR,
# tagged with the commit SHA (immutable; the deploy step pins both Dokploy apps to it) and `main` (latest build,
# for manual pulls).
#
# The API and the workers (Facebook publication, bulk email) are pinned to the same `:<sha>` and redeployed together,
# so they never run different code. Redeploying a worker is safe on its own: its swarm service is stop-first with a
# stop grace period, and on SIGTERM the worker finishes its current jobs before exiting. The pause -> drain -> resume
# routine is only needed when moving the worker to another host (docs: express-vps-migration-runbook.md).
#
# Repository settings needed before the deploy step runs:
#   Variables: DOKPLOY_DEPLOY_ENABLED=true, DOKPLOY_URL=https://dock.imotko.mk
#   Secrets:   DOKPLOY_API_KEY, DOKPLOY_API_APPLICATION_ID, DOKPLOY_WORKER_FACEBOOK_APPLICATION_ID,
#              DOKPLOY_WORKER_BULK_EMAIL_APPLICATION_ID
#              (a worker whose secret is missing is skipped with a warning)
name: Build and deploy image

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-image-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  # Not named `Dockerfile`: Railway auto-switches to any root Dockerfile, and Railway must keep its
                  # current build while it is the fallback.
                  file: Dockerfile.vps
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ github.sha }}
                      ghcr.io/${{ github.repository }}:main
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy API and workers on Dokploy
              if: ${{ github.ref == 'refs/heads/main' && vars.DOKPLOY_DEPLOY_ENABLED == 'true' }}
              env:
                  DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
                  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
                  API_APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
                  FACEBOOK_WORKER_APPLICATION_ID: ${{ secrets.DOKPLOY_WORKER_FACEBOOK_APPLICATION_ID }}
                  BULK_EMAIL_WORKER_APPLICATION_ID: ${{ secrets.DOKPLOY_WORKER_BULK_EMAIL_APPLICATION_ID }}
                  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
              # Pin each app to this commit's immutable tag first, so the deploy can't reuse a cached `:main` and the
              # Dokploy UI always shows which commit is live. Rollback = set the image to an older `:<sha>` and deploy.
              #
              # Retries: a GitHub runner is sometimes dropped on its way to the VPS (connect timeout to dock.imotko.mk
              # while the panel is up). Both calls are safe to repeat: `update` sets the same image, and a repeated
              # `deploy` of the same image only restarts the app once more.
              # Workers go after the API, so a failed API deploy stops the job before the apps can drift apart.
              run: |
                  dokploy() {
                    curl --fail-with-body -sS -X POST "${DOKPLOY_URL}/api/$1" \
                      --connect-timeout 20 --max-time 120 \
                      --retry 5 --retry-all-errors --retry-delay 15 \
                      -H "Content-Type: application/json" \
                      -H "x-api-key: ${DOKPLOY_API_KEY}" \
                      -d "$2"
                    echo
                  }

                  deploy_app() {
                    echo "Deploying $1 -> ${IMAGE}"
                    dokploy application.update "$(jq -n --arg id "$2" --arg image "$IMAGE" '{applicationId: $id, dockerImage: $image}')"
                    dokploy application.deploy "$(jq -n --arg id "$2" --arg title "${GITHUB_SHA::7}" '{applicationId: $id, title: $title}')"
                  }

                  deploy_app API "$API_APPLICATION_ID"

                  deploy_worker() {
                    if [ -n "$2" ]; then
                      deploy_app "$1 worker" "$2"
                    else
                      echo "::warning::$3 is not set; the $1 worker was not deployed"
                    fi
                  }

                  deploy_worker Facebook "$FACEBOOK_WORKER_APPLICATION_ID" DOKPLOY_WORKER_FACEBOOK_APPLICATION_ID
                  deploy_worker "bulk email" "$BULK_EMAIL_WORKER_APPLICATION_ID" DOKPLOY_WORKER_BULK_EMAIL_APPLICATION_ID
